onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[keys]
prefix = "ctrl+a"
# Tabs: prefix-free like ctrl+n/p windows in tmux. Workspaces: prefix+n/p.
next_tab = "ctrl+n"
previous_tab = "ctrl+p"
next_workspace = "prefix+n"
previous_workspace = "prefix+p"

[ui.sound]
enabled = false

# Pick a URL from the focused pane and open it in the browser
[[keys.command]]
key = "prefix+u"
type = "popup"
command = "~/.config/herdr/open-url.sh"
width = "80%"
height = "40%"

# Pick an agent, sorted by urgency (blocked > done > working > idle), and jump to it
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "~/.config/herdr/agent-picker.sh"
width = "90%"
height = "70%"
