---
- name: Setup dotfiles
  hosts: default
  vars:
    is_macos: "{{ ansible_os_family == 'Darwin' }}"
    is_debian: "{{ ansible_os_family == 'Debian' }}"
  tasks:
    # --- macOS Tasks (Homebrew) ---
    - name: Install packages with Homebrew (macOS)
      when: is_macos
      community.general.homebrew:
        name:
          - bat
          - kitty
          - stow
          - tmux
          - zsh
          - fzf
          - jq
          - ranger
          - direnv
          - neovim
          - ripgrep
          - fd
          - gcc
          - make
          - lazygit
        state: present

    # --- Debian/Linux Tasks (Apt & Snap) ---
    - name: Install packages with apt (Debian)
      when: is_debian
      become: yes
      ansible.builtin.apt:
        name:
          - build-essential
          - bat
          - kitty
          - stow
          - tmux
          - zsh
          - fzf
          - jq
          - ranger
          - direnv
          - ripgrep
          - fd-find  # Note: 'fd-find' on Debian
        state: present

    - name: Install i3 packages with apt (Debian only)
      when: is_debian
      become: yes
      ansible.builtin.apt:
        name:
          - i3
          - feh
          - polybar
          - blueman
          - maim
          - picom
          - redshift
          - xclip             # screenshot -> clipboard (maim | xclip)
          - pulseaudio-utils  # provides the pactl binary for i3 mic-mute binding
        state: present

    - name: Install Neovim with snap (Debian)
      when: is_debian
      become: yes
      community.general.snap:
        name:
          - nvim
        state: present
        classic: true

    - name: Install lazygit from GitHub release (Debian; not in apt)
      when: is_debian
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v lazygit >/dev/null 2>&1; then
          ver=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/jesseduffield/lazygit/releases/latest | sed 's#.*/tag/v##')
          tmp=$(mktemp -d)
          curl -fsSL "https://github.com/jesseduffield/lazygit/releases/download/v${ver}/lazygit_${ver}_Linux_x86_64.tar.gz" -o "$tmp/lg.tar.gz"
          tar -xzf "$tmp/lg.tar.gz" -C "$tmp" lazygit
          sudo install "$tmp/lazygit" /usr/local/bin/lazygit
          rm -rf "$tmp"
        fi
      args:
        executable: /bin/bash
      changed_when: false

    # --- Shared Tasks ---
    - name: Install roborev (continuous code review) via official script
      ansible.builtin.shell: |
        if ! command -v roborev >/dev/null 2>&1; then
          curl -fsSL https://roborev.io/install.sh | bash
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Install Herdr (terminal workspace manager) via official script
      ansible.builtin.shell: |
        if ! command -v herdr >/dev/null 2>&1 && [ ! -x "$HOME/.local/bin/herdr" ]; then
          curl -fsSL https://herdr.dev/install.sh | sh
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Run Oh My Zsh installation script
      shell: |
        if [ ! -d "/home/{{ ansible_user_id }}/.oh-my-zsh" ] && [ ! -d "/Users/{{ ansible_user_id }}/.oh-my-zsh" ]; then
          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
        fi
      environment:
        ZSH: "{{ ansible_env.HOME }}/.oh-my-zsh"

    - name: Remove files that will conflict with Stow
      loop:
        - .zshrc
        - .tmux.conf
        - .profile
        - .wallpaper.jpg
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/{{ item }}"
        state: absent

    - name: Run stow
      shell: "stow . --target {{ ansible_env.HOME }} --verbose=2"
      register: result
      changed_when: "'LINK: ' in result.stderr"

    - name: Link Herdr visit-tracker plugin (after stow creates ~/.config/herdr/visit-tracker)
      ansible.builtin.shell: |
        herdr=$(command -v herdr || echo "$HOME/.local/bin/herdr")
        if ! "$herdr" plugin list | grep -q 'johan.visit-tracker'; then
          "$herdr" plugin link "$HOME/.config/herdr/visit-tracker"
        fi
      args:
        executable: /bin/bash
      changed_when: false
